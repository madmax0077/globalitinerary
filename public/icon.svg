  />

  <circle cx="15.5" cy="45.5" r="3.2" fill="#FFFFFF"/>
  <circle cx="15.5" cy="45.5" r="1.4" fill="#2563EB"/>
  <circle cx="35" cy="34" r="3.3" fill="#FFFFFF"/>
  <circle cx="35" cy="34" r="1.45" fill="#0EA5E9"/>

