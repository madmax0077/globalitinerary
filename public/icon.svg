  <path
    fill="#F97316"
    d="M51 15.2c-3.7 0-6.7 2.95-6.7 6.6 0 4.55 5.1 10.1 6.3 11.35a0.55 0.55 0 0 0 .8 0C52.6 31.9 57.7 26.35 57.7 21.8c0-3.65-3-6.6-6.7-6.6Z"
