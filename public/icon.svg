    <!-- horizontal stabilizer -->
    <path fill="#FEF3C7" d="M1.6 6.4 L5.2 6.1 L5.6 8.6 L2.2 8.8 Z"/>
    <!-- fuselage (sleek airliner profile) -->
    <path fill="#FFFFFF" d="
      M2.8 6.9
      C2.8 5.5 3.9 4.6 5.4 4.6
      L18.2 4.15
      C21.8 4 23.8 4.7 25.1 6
      C25.7 6.55 25.55 7.4 24.7 7.6
      L18.6 8.55
      L5.6 8.75
      C4 8.75 2.8 7.9 2.8 6.9Z"/>
    <!-- cockpit -->
    <path fill="#38BDF8" d="M19.4 4.55 C21.2 4.45 22.8 4.9 23.6 5.85 C23 6.35 21.8 6.55 20.4 6.4 L19.3 5.35 Z"/>
    <!-- windows -->
    <rect x="10.2" y="5.35" width="1.15" height="1.05" rx="0.35" fill="#7DD3FC"/>
    <rect x="12.1" y="5.3" width="1.15" height="1.05" rx="0.35" fill="#7DD3FC"/>
    <rect x="14" y="5.25" width="1.15" height="1.05" rx="0.35" fill="#7DD3FC"/>
    <rect x="15.9" y="5.2" width="1.15" height="1.05" rx="0.35" fill="#7DD3FC"/>
