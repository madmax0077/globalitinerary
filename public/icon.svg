<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="giBg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="giRoute" x1="12" y1="44" x2="50" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#giBg)"/>

  <circle cx="33" cy="36" r="17" fill="#FFFFFF" fill-opacity="0.14"/>
  <circle cx="33" cy="36" r="17" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <ellipse cx="33" cy="36" rx="17" ry="6.6" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.25" fill="none"/>
  <path d="M33 19v34" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.25"/>

  <path
    d="M15 46 C21 32, 29 52, 35 34 S45 22, 49 24"
    stroke="url(#giRoute)"
    stroke-width="3.1"
    stroke-linecap="round"
    stroke-linejoin="round"
